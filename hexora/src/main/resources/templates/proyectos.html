<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="~{fragments/security-head :: securityHead}"></th:block>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyHat - Proyectos</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet" href="../static/css/style.css" th:href="@{/css/style.css(v=${#dates.createNow().time})}">
    <link rel="stylesheet" href="../static/css/responsive-tablet.css" th:href="@{/css/responsive-tablet.css(v=${#dates.createNow().time})}">
    <link rel="stylesheet" th:href="@{/vendor/fontawesome/css/all.min.css}">
</head>
<body class="pagina-oscura">

    <th:block th:replace="~{fragments/fondo-red :: fondo}"></th:block>
    <th:block th:replace="~{fragments/sidebar :: sidebar('proyectos')}"></th:block>

    <main id="contenido-principal" tabindex="-1" class="contenido-principal">

        <section class="cabecera-gestion">

            <div class="texto-cabecera">
                <h1 class="titulo-interno">Gestión de proyectos</h1>
                <p class="subtitulo">Administra tus proyectos de auditoría y pentesting</p>
            </div>

            <a th:if="${canManageProjects}" th:href="@{/proyectos/nuproyectos}" class="btn btn-primario">
                <i class="fa-solid fa-plus" aria-hidden="true"></i> Nuevo proyecto
            </a>

        </section>

        <section class="tarjeta-blanca contenedor-busqueda">

            <div class="campo-busqueda">
                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                <label for="buscador" class="sr-only">Buscar proyectos por nombre, empresa o estado</label>
                <input class="form-control" type="search" id="buscador" autocomplete="off"
                    placeholder="Buscar por nombre, empresa o estado">
            </div>

        </section>

        <section class="tabla-contenedor tarjeta-blanca">
            <p class="contador-proyectos" id="contador-proyectos" role="status" aria-live="polite"
               th:attr="data-total=${#lists.size(auditorias)}"
               th:text="${#lists.size(auditorias) == 1} ? '1 proyecto' : ${#lists.size(auditorias)} + ' proyectos'">2 proyectos</p>
            <div class="table-responsive">
            <table class="tabla-hexora table">
                <thead>
                    <tr>
                        <th scope="col">Proyecto</th>
                        <th scope="col">Empresa</th>
                        <th scope="col">Estado</th>
                        <th scope="col">Inicio</th>
                        <th scope="col">Fin</th>
                        <th scope="col"><span class="sr-only">Acciones</span></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(auditorias)}">
                        <td colspan="6" class="tabla-vacia">
                            Todavía no hay proyectos.
                            <a th:if="${canManageProjects}" th:href="@{/proyectos/nuproyectos}">Crea el primero</a>
                        </td>
                    </tr>

                    <tr th:each="aud : ${auditorias}" class="fila-enlace"
                        th:data-href="@{/proyectos/{id}(id=${aud.publicId})}"
                        th:data-busqueda="${aud.nombre + ' ' + (aud.empresa != null ? aud.empresa.nombre : '') + ' ' + aud.estado}">
                        <td class="nombre-destacado">
                            <a th:href="@{/proyectos/{id}(id=${aud.publicId})}" th:text="${aud.nombre}">Nombre del proyecto</a>
                        </td>
                        <td class="texto-empresa">
                            <i class="fa-solid fa-building" aria-hidden="true"></i>
                            <span th:text="${aud.empresa != null} ? ${aud.empresa.nombre} : '—'">Empresa</span>
                        </td>
                        <td>
                            <span th:text="${aud.estado}"
                                th:classappend="${aud.estado == 'Completado'} ? 'badge-verde' : (${aud.estado == 'Planificado'} ? 'badge-gris' : 'badge-azul')"
                                class="badge"></span>
                        </td>
                        <td class="fecha-tabla" th:text="${#temporals.format(aud.fechaInico, 'dd/MM/yyyy')} ?: '—'">01/01/2026</td>
                        <td class="fecha-tabla" th:text="${#temporals.format(aud.fechaFin, 'dd/MM/yyyy')} ?: '—'">01/01/2026</td>
                        <td class="acciones-tabla">
                            <form th:if="${canManageProjects}" th:action="@{/proyectos/{id}/eliminar(id=${aud.publicId})}" method="post" class="inline-form" data-confirm-message="¿Eliminar proyecto?">
                                <button type="submit" class="btn btn-eliminar" th:attr="aria-label=|Eliminar proyecto ${aud.nombre}|">
                                    <i class="fa-solid fa-trash-can" aria-hidden="true"></i>
                                </button>
                            </form>
                            <i class="fa-solid fa-chevron-right indicador-fila" aria-hidden="true"></i>
                        </td>
                    </tr>

                    <tr id="sin-resultados" hidden>
                        <td colspan="6" class="tabla-vacia">
                            Ningún proyecto coincide con <strong id="sin-resultados-texto"></strong>.
                        </td>
                    </tr>
                </tbody>
            </table>
            </div>
        </section>

    </main>

    <script th:src="@{/js/project-list-filter.js(v=3)}" defer></script>
</body>
</html>
