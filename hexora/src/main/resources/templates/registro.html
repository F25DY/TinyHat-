<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="~{fragments/security-head :: securityHead}"></th:block>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyHat - Crear cuenta de auditor</title>
    <th:block th:replace="~{fragments/acceso :: estilos}"></th:block>
</head>
<body>
    <th:block th:replace="~{fragments/acceso :: fondo}"></th:block>

    <main class="container-fluid d-flex flex-column align-items-center justify-content-center min-vh-100 px-3">
        <div class="row w-100 mx-auto contenido-login align-items-center justify-content-between g-4 g-xl-5">

            <th:block th:replace="~{fragments/acceso :: hero('Organiza tus auditorías', 'en un solo lugar.', 'Crea tu cuenta de auditor en minutos y reúne proyectos, hallazgos e informes con la tranquilidad de que tu información está protegida.')}"></th:block>

            <div class="col-12 col-md-10 col-lg-5 order-1 order-lg-2">
                <section class="login login-vertical" aria-labelledby="acceso-titulo">
                    <div class="verificacion-icono" aria-hidden="true"><i class="fa-solid fa-user-plus"></i></div>

                    <div class="login-encabezado">
                        <h1 class="login-titulo verificacion-titulo" id="acceso-titulo">Crea tu cuenta de auditor</h1>
                        <p class="login-subtitulo">Completa tus datos para empezar a gestionar tus proyectos.</p>
                    </div>

                    <form th:action="@{/registro}" method="post" th:object="${form}" class="verificacion-form">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <label for="nombre">Nombre o razón social</label>
                        <div class="campo-con-icono">
                            <i class="fa-regular fa-id-card icono-campo" aria-hidden="true"></i>
                            <input type="text" id="nombre" name="nombre" placeholder="Auditor o empresa" maxlength="100" autocomplete="organization">
                        </div>
                        <p th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="feedback-error"></p>

                        <label for="email">Correo electrónico</label>
                        <div class="campo-con-icono">
                            <i class="fa-regular fa-envelope icono-campo" aria-hidden="true"></i>
                            <input type="email" id="email" name="email" placeholder="auditor@empresa.com" required maxlength="254" autocomplete="email">
                        </div>
                        <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="feedback-error"></p>

                        <label for="password">Contraseña (mínimo 12 caracteres)</label>
                        <div class="campo-con-icono">
                            <i class="fa-solid fa-lock icono-campo" aria-hidden="true"></i>
                            <input type="password" id="password" name="password" placeholder="••••••••••••" required autocomplete="new-password">
                        </div>
                        <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="feedback-error"></p>

                        <p th:if="${param.error}" class="feedback-error" role="alert" th:text="${param.error}">Error en el registro.</p>
                        <p th:if="${error}" class="feedback-error" role="alert" th:text="${error}"></p>

                        <button type="submit" class="btn btn-primario w-100">Crear cuenta</button>
                    </form>

                    <p class="acceso-enlaces">
                        <a th:href="@{/login}">¿Ya tienes cuenta? Inicia sesión</a>
                    </p>
                </section>
            </div>
        </div>

        <th:block th:replace="~{fragments/acceso :: pie}"></th:block>
    </main>

    <th:block th:replace="~{fragments/acceso :: scripts}"></th:block>
</body>
</html>
