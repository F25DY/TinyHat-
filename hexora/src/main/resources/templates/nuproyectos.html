<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyHat - Crear Proyecto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/style.css" th:href="@{/css/style.css(v=${#dates.createNow().time})}">
    <link rel="stylesheet" href="../static/css/responsive-tablet.css" th:href="@{/css/responsive-tablet.css(v=${#dates.createNow().time})}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <aside class="sidebar">
        <div class="logo-plataforma">
            <div class="textos-marca">
                <img th:src="@{/imagen/logo.png}" width="40" alt="Logo">
                <span class="nombre-completo"><span class="tinyhat-tiny">Tiny</span><span class="tinyhat-hat">Hat</span></span>
            </div>
        </div>

        <nav class="menu">

            <ul>
                <li>
                    <a th:href="@{/dashboard}" class="enlace-menu">
                        <i class="fa-solid fa-house"></i> Dashboard
                    </a>
                </li>

                <li>
                    <a th:href="@{/proyectos}" class="enlace-menu activo">
                        <i class="fa-solid fa-folder-closed"></i> Proyectos
                    </a>
                </li>
            </ul>

        </nav>

        <div class="contenedor-usuario">

            <div class="info-perfil">
                <div class="avatar-usuario">
                    <i class="fa-solid fa-user-shield"></i>
                </div>

                <div class="datos-texto">
                    <span class="nombre-usuario">Analista</span>
                    <span class="correo-usuario">analista@gmail.com</span>
                </div>

            </div>

            <a th:href="@{/}" class="boton-cerrar-sesion">
                <i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión
            </a>

        </div>
    </aside>

    <main class="contenido-principal">
        <header class="encabezado-retorno">
            <a th:href="@{/proyectos}" class="link-volver">
                <i class="fa-solid fa-arrow-left"></i>
            </a>

            <div class="titulos-nuevo">
                <h1 class="titulo-pagina">Crear Nuevo Proyecto</h1>
                <p class="subtitulo">Configura un nuevo proyecto de auditoría o pentesting</p>
            </div>
        </header>

        <section class="tarjeta-blanca contenedor-formulario">
            <h3 class="seccion-form-titulo">Información Básica</h3>

            <form th:action="@{/proyectos/guardar}" method="post" id="form-nuevo-proyecto" class="form-proyecto">
                <div class="grid-form row g-3">
                    <div class="campo-grupo col-md-6">
                        <label for="nombreEmpresa">Empresa / Auditoría <span class="requerido">*</span></label>
                        <input class="form-control" type="text" id="nombreEmpresa" name="nombreEmpresa" placeholder="Ej: Banco Nacional" required>
                    </div>

                    <div class="campo-grupo col-md-6">
                        <label for="nit">NIT</label>
                        <input class="form-control" type="text" id="nit" name="nit" placeholder="Ej: 123456789">
                    </div>

                    <div class="campo-grupo col-md-6">
                        <label for="sector">Sector</label>
                        <input class="form-control" type="text" id="sector" name="sector" placeholder="Ej: Financiero">
                    </div>

                    <div class="campo-grupo col-md-6">
                        <label for="nombre">Nombre del Proyecto <span class="requerido">*</span></label>
                        <input class="form-control" type="text" id="nombre" name="nombre" placeholder="Ej: Auditoría Sistema Bancario" required>
                    </div>

                    <div class="campo-grupo col-md-6">
                        <label for="tipoAuditoria">Tipo de Auditoría <span class="requerido">*</span></label>
                        <input class="form-control" type="text" id="tipoAuditoria" name="tipoAuditoria" placeholder="Ej: Auditoría Interna" required>
                    </div>

                    <div class="campo-grupo col-md-6">
                        <label for="estado">Estado <span class="requerido">*</span></label>
                        <select class="form-select" id="estado" name="estado" required>
                            <option value="">Seleccionar estado</option>
                            <option value="Planificado">Planificado</option>
                            <option value="En Progreso">En progreso</option>
                            <option value="Completado">Completado</option>
                        </select>
                    </div>

                    <div class="campo-grupo col-md-6">
                        <label for="fechaInicio">Fecha de Inicio <span class="requerido">*</span></label>
                        <input class="form-control" type="date" id="fechaInicio" name="fechaInicio" required>
                    </div>

                    <div class="campo-grupo col-md-6">
                        <label for="fechaFin">Fecha de Finalización</label>
                        <input class="form-control" type="date" id="fechaFin" name="fechaFin">
                    </div>
                </div>

                <div class="acciones-formulario">
                    <a th:href="@{/proyectos}" class="btn btn-cancelar">Cancelar</a>
                    <button type="submit" class="btn btn-guardar">Crear Proyecto</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
