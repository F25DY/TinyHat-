<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="~{fragments/security-head :: securityHead}"></th:block>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexora - Recuperar Contraseña</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v=${#dates.createNow().time})}">
</head>
<body>
    <main>
        <section class="login">
            <header>
                <img th:src="@{/imagen/logo.png}" alt="Logo Hexora">
                <h1>Hexora</h1>
                <p>Recuperación de Contraseña</p>
            </header>

            <form th:action="@{/recuperar}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="usuario@gmail.com" required maxlength="254">

                <p th:if="${param.sent}" class="feedback-success">
                    Si el correo está registrado en el sistema, recibirás un enlace de recuperación.
                </p>

                <button type="submit">Enviar Enlace</button>
            </form>

            <p class="spaced-paragraph">
                <a th:href="@{/login}">Volver al inicio de sesión</a>
            </p>
        </section>
    </main>

    <footer class="pie-pagina-login">
        <p>Secure Access &bull; Encrypted Connection</p>
    </footer>
</body>
</html>
