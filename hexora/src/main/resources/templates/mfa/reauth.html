<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="~{fragments/security-head :: securityHead}"></th:block>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyHat - Confirma tu identidad</title>
    <th:block th:replace="~{fragments/acceso :: estilos}"></th:block>
</head>
<body>
    <th:block th:replace="~{fragments/acceso :: fondo}"></th:block>

    <main class="container-fluid d-flex flex-column align-items-center justify-content-center min-vh-100 px-3">
        <div class="row w-100 mx-auto contenido-login align-items-center justify-content-between g-4 g-xl-5">

            <th:block th:replace="~{fragments/acceso :: hero('Confirma tu identidad', 'para continuar con tranquilidad.', 'Es una acción importante, por eso te pedimos confirmar que eres tú. Solo toma un momento y deja tu información mejor cuidada.')}"></th:block>

            <div class="col-12 col-md-10 col-lg-5 order-1 order-lg-2">
                <section class="login login-vertical" aria-labelledby="acceso-titulo">
                    <div class="verificacion-icono" aria-hidden="true"><i class="fa-solid fa-user-shield"></i></div>

                    <div class="login-encabezado">
                        <h1 class="login-titulo verificacion-titulo" id="acceso-titulo">Confirma tu identidad</h1>
                        <p class="login-subtitulo" th:if="${required}">Por seguridad, esta acción pide confirmar tu contraseña y tu código de verificación.</p>
                        <p class="login-subtitulo" th:unless="${required}">Ingresa tu contraseña y el código de tu aplicación de autenticación.</p>
                    </div>

                    <form method="post" th:action="@{/mfa/reauth}" class="verificacion-form">
                        <label for="password">Contraseña</label>
                        <div class="campo-con-icono">
                            <i class="fa-solid fa-lock icono-campo" aria-hidden="true"></i>
                            <input id="password" name="password" type="password" autocomplete="current-password" required autofocus placeholder="••••••••">
                        </div>

                        <label for="code">Código de verificación</label>
                        <div class="campo-codigo">
                            <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code"
                                   autocapitalize="off" spellcheck="false" maxlength="64" required placeholder="123456"
                                   th:attr="aria-invalid=${error != null} ? 'true' : null, aria-describedby=${error != null} ? 'acceso-error' : null">
                        </div>

                        <p th:if="${error}" id="acceso-error" role="alert" class="feedback-error" th:text="${error}">Error.</p>

                        <button type="submit" class="btn btn-primario w-100">Confirmar identidad</button>
                    </form>

                    <p class="acceso-enlaces"><a th:href="@{/dashboard}">Volver al panel</a></p>
                </section>
            </div>
        </div>

        <th:block th:replace="~{fragments/acceso :: pie}"></th:block>
    </main>

    <th:block th:replace="~{fragments/acceso :: scripts}"></th:block>
</body>
</html>
