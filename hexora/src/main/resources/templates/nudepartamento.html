<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="~{fragments/security-head :: securityHead}"></th:block>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyHat - Nueva Área</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet" href="../static/css/style.css" th:href="@{/css/style.css(v=${#dates.createNow().time})}">
    <link rel="stylesheet" href="../static/css/responsive-tablet.css" th:href="@{/css/responsive-tablet.css(v=${#dates.createNow().time})}">
    <link rel="stylesheet" th:href="@{/vendor/fontawesome/css/all.min.css}">
</head>
<body class="pagina-oscura">

    <th:block th:replace="~{fragments/fondo-red :: fondo}"></th:block>
    <th:block th:replace="~{fragments/sidebar :: sidebar('proyectos')}"></th:block>

    <main id="contenido-principal" tabindex="-1" class="contenido-principal">
      <div class="columna-central columna-formulario">

        <header class="encabezado-retorno">
            <a th:href="@{/proyectos/{id}(id=${auditoria.publicId})}" class="link-volver" aria-label="Volver al proyecto">
                <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
            </a>
            <div class="titulos-nuevo">
                <h1 class="titulo-pagina" th:text="${areaEditing} ? 'Editar área' : 'Agregar área'">
                    Agregar área
                </h1>
                <p class="subtitulo" th:text="${areaEditing} ? 'Actualiza la información del área auditable' : 'Un área es lo que se audita: un servidor, una aplicación, una página web, un datacenter o la infraestructura'">
                    Un área es lo que se audita: un servidor, una aplicación, una página web, un datacenter o la infraestructura
                </p>
            </div>
        </header>

        <section class="tarjeta-blanca formulario-simple">
            <h2 class="seccion-form-titulo" th:text="${areaEditing} ? 'Editar área auditable' : 'Información del área'">
                Información del área
            </h2>

            <form th:action="${areaAction}"
                    th:object="${areaForm}"
                    method="post"
                    class="form-proyecto">

                <div class="grid-paso grid-una-columna">
                    <div class="campo-grupo">
                        <label for="nombre">Nombre del área <span class="requerido" aria-hidden="true">*</span></label>
                        <input class="form-control" type="text"
                            th:field="*{nombre}" maxlength="150"
                            placeholder="Ej: Aplicaciones web, API REST, Infraestructura" required>
                        <small class="mensaje-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></small>
                    </div>

                    <div class="campo-grupo">
                        <label for="descripcion">Descripción <span class="requerido" aria-hidden="true">*</span></label>
                        <textarea class="form-control" th:field="*{descripcion}"
                                  rows="5" maxlength="10000"
                                  placeholder="Describe qué se audita y hasta dónde llega el alcance..." required></textarea>
                        <small class="mensaje-error" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></small>
                    </div>
                </div>

                <div class="paso-acciones">
                    <a th:href="@{/proyectos/{id}(id=${auditoria.publicId})}" class="btn btn-secundario">Cancelar</a>
                    <button type="submit" class="btn btn-primario">
                        <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i>
                        <span th:text="${areaEditing} ? 'Actualizar área' : 'Crear área'">Crear área</span>
                    </button>
                </div>

            </form>
        </section>

      </div>
    </main>

</body>
</html>
