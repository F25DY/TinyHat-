<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="~{fragments/security-head :: securityHead}"></th:block>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyHat - Activa tu cuenta</title>
    <th:block th:replace="~{fragments/acceso :: estilos}"></th:block>
</head>
<body>
    <th:block th:replace="~{fragments/acceso :: fondo}"></th:block>

    <main class="container-fluid d-flex flex-column align-items-center justify-content-center min-vh-100 px-3">
        <div class="row w-100 mx-auto contenido-login align-items-center justify-content-between g-4 g-xl-5">

            <th:block th:replace="~{fragments/acceso :: hero('Tu organización ya te espera', 'en TinyHat.', 'Activa tu cuenta para ver el estado de seguridad de tu empresa y dar seguimiento a cada mejora, todo desde un mismo lugar.')}"></th:block>

            <div class="col-12 col-md-10 col-lg-5 order-1 order-lg-2">
                <section class="login login-vertical" aria-labelledby="acceso-titulo">
                    <div class="verificacion-icono" aria-hidden="true"><i class="fa-solid fa-envelope-open-text"></i></div>

                    <div class="login-encabezado">
                        <h1 class="login-titulo verificacion-titulo" id="acceso-titulo">Te damos la bienvenida</h1>
                        <p class="login-subtitulo">Te invitaron a administrar el portal de tu organización. Elige tu contraseña para activar la cuenta.</p>
                    </div>

                    <form th:action="@{/invitacion/{token}(token=${token})}" method="post" class="verificacion-form">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                        <label for="email">Correo electrónico</label>
                        <div class="campo-con-icono">
                            <i class="fa-regular fa-envelope icono-campo" aria-hidden="true"></i>
                            <input type="email" id="email" th:value="${email}" readonly class="readonly-input">
                        </div>

                        <label for="password">Nueva contraseña (mínimo 12 caracteres)</label>
                        <div class="campo-con-icono">
                            <i class="fa-solid fa-lock icono-campo" aria-hidden="true"></i>
                            <input type="password" id="password" name="password" placeholder="••••••••••••" required autocomplete="new-password" autofocus>
                        </div>

                        <button type="submit" class="btn btn-primario w-100">Activar cuenta</button>
                    </form>

                    <p class="acceso-enlaces">
                        <a th:href="@{/login}">Volver al inicio de sesión</a>
                    </p>
                </section>
            </div>
        </div>

        <th:block th:replace="~{fragments/acceso :: pie}"></th:block>
    </main>

    <th:block th:replace="~{fragments/acceso :: scripts}"></th:block>
</body>
</html>
