<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="~{fragments/security-head :: securityHead}"></th:block>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexora - Aceptar Invitación</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v=${#dates.createNow().time})}">
</head>
<body>
    <main>
        <section class="login">
            <header>
                <img th:src="@{/imagen/logo.png}" alt="Logo Hexora">
                <h1>Hexora</h1>
                <p>Invitación como Administrador de Organización</p>
            </header>

            <p>Bienvenido. Has sido invitado para gestionar el portal de tu organización.</p>
            <p>Por favor, define tu contraseña de acceso para comenzar:</p>

            <form th:action="@{/invitacion/{token}(token=${token})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" th:value="${email}" readonly class="readonly-input">

                <label for="password">Nueva Contraseña (mínimo 12 caracteres)</label>
                <input type="password" id="password" name="password" placeholder="••••••••••••" required>

                <button type="submit">Activar Cuenta</button>
            </form>

            <p class="spaced-paragraph">
                <a th:href="@{/login}">Volver al inicio de sesión</a>
            </p>
        </section>
    </main>

    <footer class="pie-pagina-login">
        <p>Secure Access &bull; Encrypted Connection</p>
    </footer>
</body>
</html>
