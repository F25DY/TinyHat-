# Perfil prod: valores estrictos; ProfileSecurityGuard rechaza el arranque si se relajan.
server.address=${SERVER_ADDRESS:0.0.0.0}
server.ssl.enabled=${TINYHAT_SSL_ENABLED:true}
server.ssl.key-store=${TINYHAT_SSL_KEY_STORE}
server.ssl.key-store-password=${TINYHAT_SSL_KEY_STORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.servlet.session.cookie.secure=true

# Usuario de ejecucion sin DDL; Flyway con credenciales separadas (ver docs/security/db-privilegios.md).
spring.datasource.url=${DB_URL}
spring.flyway.url=${FLYWAY_DB_URL}
spring.flyway.user=${FLYWAY_DB_USER}
spring.flyway.password=${FLYWAY_DB_PASSWORD}

tinyhat.security.public-base-url=${PUBLIC_BASE_URL}
tinyhat.security.mfa.required=true
tinyhat.security.csp.report-only=false
tinyhat.security.network.allow-public-ranges=false
tinyhat.demo.seed.enabled=false
