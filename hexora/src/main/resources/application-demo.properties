# Perfil demo: red de laboratorio enlazada a 127.0.0.1 con HTTPS local.
server.ssl.enabled=${TINYHAT_SSL_ENABLED:false}
server.ssl.key-store=${TINYHAT_SSL_KEY_STORE:}
server.ssl.key-store-password=${TINYHAT_SSL_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=PKCS12

tinyhat.security.ws.allowed-origins[0]=https://localhost:8443
tinyhat.security.ws.allowed-origins[1]=https://127.0.0.1:8443

tinyhat.demo.seed.enabled=false
hexora.network.discovery-enabled=${NETWORK_DISCOVERY_ENABLED:false}
