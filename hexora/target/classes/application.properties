spring.application.name=hexora
spring.config.import=optional:file:.env[.properties]
spring.profiles.default=dev

server.address=127.0.0.1
server.port=${APP_PORT:8080}
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=10m
server.servlet.session.cookie.name=TINYHAT_SID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3307/${DB_NAME:hexora_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.url=${FLYWAY_DB_URL:${spring.datasource.url}}
spring.flyway.user=${FLYWAY_DB_USER:${spring.datasource.username}}
spring.flyway.password=${FLYWAY_DB_PASSWORD:${spring.datasource.password}}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

tinyhat.security.session.idle-minutes=5
tinyhat.security.session.absolute-minutes=120
tinyhat.security.session.max-per-user=1
tinyhat.security.session.poll-paths[0]=/api/network/events/**
tinyhat.security.session.poll-paths[1]=/api/poll/**
tinyhat.security.session.poll-paths[2]=/ws/**
tinyhat.security.reauth.max-age-minutes=5
tinyhat.security.password.min-length=12
tinyhat.security.password.max-bytes=72
tinyhat.security.login.throttle.schedule-seconds=0,0,0,0,60,300,900,1800
tinyhat.security.login.throttle.reset-window-minutes=30
tinyhat.security.mfa.required=true
tinyhat.security.mfa.max-attempts=5
tinyhat.security.mfa.key=${TINYHAT_MFA_KEY:}
tinyhat.security.ratelimit.auth.capacity=5
tinyhat.security.ratelimit.auth.refill-tokens=5
tinyhat.security.ratelimit.auth.refill-seconds=60
tinyhat.security.ratelimit.registro.capacity=5
tinyhat.security.ratelimit.registro.refill-tokens=5
tinyhat.security.ratelimit.registro.refill-seconds=3600
tinyhat.security.ratelimit.mfa.capacity=5
tinyhat.security.ratelimit.mfa.refill-tokens=5
tinyhat.security.ratelimit.mfa.refill-seconds=60
tinyhat.security.ratelimit.token.capacity=5
tinyhat.security.ratelimit.token.refill-tokens=5
tinyhat.security.ratelimit.token.refill-seconds=60
tinyhat.security.ratelimit.cve-search.capacity=10
tinyhat.security.ratelimit.cve-search.refill-tokens=10
tinyhat.security.ratelimit.cve-search.refill-seconds=60
tinyhat.security.ratelimit.network-discover.capacity=1
tinyhat.security.ratelimit.network-discover.refill-tokens=1
tinyhat.security.ratelimit.network-discover.refill-seconds=60
tinyhat.security.ratelimit.pdf.capacity=5
tinyhat.security.ratelimit.pdf.refill-tokens=5
tinyhat.security.ratelimit.pdf.refill-seconds=60
tinyhat.security.ratelimit.api-general.capacity=120
tinyhat.security.ratelimit.api-general.refill-tokens=120
tinyhat.security.ratelimit.api-general.refill-seconds=60
tinyhat.security.ratelimit.poll.capacity=30
tinyhat.security.ratelimit.poll.refill-tokens=30
tinyhat.security.ratelimit.poll.refill-seconds=60
tinyhat.security.trusted-proxies=
tinyhat.security.ws.allowed-origins[0]=https://localhost:8443
tinyhat.security.network.max-prefix=24
tinyhat.security.network.allow-public-ranges=false
tinyhat.security.network.max-threads=64
tinyhat.security.network.scan-cooldown-seconds=60
tinyhat.security.registration.enabled=true
tinyhat.security.oauth.enabled=true
tinyhat.security.csp.report-only=true
tinyhat.security.audit.enumeration-threshold=20
tinyhat.capabilities.defaults.modulo-red=true
tinyhat.capabilities.defaults.informes-pdf=true
tinyhat.capabilities.defaults.monitoreo-continuo=true
tinyhat.nvd.api-key=${NVD_API_KEY:}
tinyhat.translation.mymemory-email=${MYMEMORY_EMAIL:}
tinyhat.demo.seed.enabled=false

hexora.network.connect-timeout-millis=${NETWORK_CONNECT_TIMEOUT_MS:500}
hexora.network.monitor-interval-ms=${NETWORK_MONITOR_INTERVAL_MS:30000}
hexora.network.discovery-interval-ms=${NETWORK_DISCOVERY_INTERVAL_MS:30000}
hexora.network.discovery-enabled=${NETWORK_DISCOVERY_ENABLED:false}
hexora.network.default-ports=${NETWORK_DEFAULT_PORTS:21,22,25,53,80,110,143,443,3306,5432}
