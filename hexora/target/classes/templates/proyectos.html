<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="~{fragments/security-head :: securityHead}"></th:block>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexora - Proyectos</title>
    <link rel="stylesheet" href="../static/css/style.css" th:href="@{/css/style.css(v=${#dates.createNow().time})}">
</head>
<body>

    <aside class="sidebar">
        <div class="logo-plataforma">
            <div class="textos-marca">
                <img th:src="@{/imagen/logo.png}" width="40" alt="Logo">
                <span class="nombre-completo">Hexora</span>
            </div>
        </div>

        <nav class="menu">
            <ul>
                <li>
                    <a th:href="@{/dashboard}" class="enlace-menu">
                        <i class="fa-solid fa-house"></i> Dashboard
                    </a>
                </li>
                <li>
                    <a th:href="@{/network-monitoring}" class="enlace-menu">
                        <i class="fa-solid fa-network-wired"></i> Escaneo de red
                    </a>
                </li>

                <li>
                    <a th:href="@{/proyectos}" class="enlace-menu activo">
                        <i class="fa-solid fa-folder-closed"></i> Proyectos
                    </a>
                </li>
            </ul>
        </nav>

        <div class="contenedor-usuario">

            <div class="info-perfil">

                <div class="avatar-usuario">
                    <i class="fa-solid fa-user-shield"></i>
                </div>

                <div class="datos-texto">
                    <span class="nombre-usuario">Analista</span>
                    <span class="correo-usuario">analista@gmail.com</span>
                </div>

            </div>

            <form th:action="@{/logout}" method="post">
                <button type="submit" class="boton-cerrar-sesion">
                    <i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión
                </button>
            </form>

        </div>
    </aside>

    <main class="contenido-principal">

        <section class="cabecera-gestion">

            <div class="texto-cabecera">
                <h2 class="titulo-interno">Gestión de Proyectos</h2>
                <p class="subtitulo">Administra tus proyectos de auditoría y pentesting</p>
            </div>

            <a th:if="${canManageProjects}" th:href="@{/proyectos/nuproyectos}" class="no-underline">
                <button class="btn-crear">
                    <i class="fa-solid fa-plus"></i> Crear Proyecto
                </button>
            </a>

        </section>

        <section class="tarjeta-blanca contenedor-busqueda">

            <div class="campo-busqueda">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="buscador"
                    placeholder="Buscar proyectos por nombre o empresa..."
                    >
            </div>

        </section>

        <section class="tabla-contenedor tarjeta-blanca">
            <p class="contador-proyectos" th:text="'Proyectos cargados: ' + ${#lists.size(auditorias)}"></p>
            <table class="tabla-hexora">
                <thead>
                    <tr>
                        <th>Proyecto</th>
                        <th>Empresa</th>
                        <th>Estado</th>
                        <th>Fecha inicio</th>
                        <th>Fecha fin</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(auditorias)}">
                        <td colspan="6" class="text-centered">No hay proyectos registrados</td>
                    </tr>

                    <tr th:each="aud : ${auditorias}">
                        <td class="nombre-destacado">
                            <a th:href="@{/proyectos/{id}(id=${aud.publicId})}" class="no-underline inherit-color">
                                <span th:text="${aud.nombre}"></span>
                            </a>
                            <br>
                            <small class="project-public-link" th:text="@{/proyectos/{id}(id=${aud.publicId})}"></small>
                        </td>
                        <td class="texto-empresa">
                            <i class="fa-solid fa-building"></i>
                            <span th:text="${aud.empresa.nombre}"></span>
                        </td>
                        <td>
                            <span th:text="${aud.estado}"
                                th:classappend="${aud.estado == 'Completado'} ? 'badge-verde' : (${aud.estado == 'Planificado'} ? 'badge-gris' : 'badge-azul')"
                                class="badge"></span>
                        </td>
                        <td th:text="${aud.fechaInico}"></td>
                        <td th:text="${aud.fechaFin}"></td>
                        <td>
                            <a th:href="@{/proyectos/{id}(id=${aud.publicId})}" class="btn-verdetalle">Ver</a>
                            <form th:if="${canManageProjects}" th:action="@{/proyectos/{id}/eliminar(id=${aud.publicId})}" method="post" class="inline-form" data-confirm-message="¿Eliminar proyecto?">
                                <button type="submit" class="btn-eliminar">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>

            <p class="contador-proyectos" th:if="${not #lists.isEmpty(auditorias)}"
                th:text="'Mostrando ' + ${#lists.size(auditorias)} + ' proyectos'">
            </p>
        </section>

    </main>

    <script th:src="@{/js/project-list-filter.js(v=1)}" defer></script>
</body>
</html>
