<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="~{fragments/security-head :: securityHead}"></th:block>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexora</title>
    <link rel="stylesheet" href="../static/css/style.css" th:href="@{/css/style.css(v=${#dates.createNow().time})}">
</head>
<body>
    <main>
        <section class="login">
            <header>
                <img th:src="@{/imagen/logo.png}" alt="Logo Hexora">
                <h1>Hexora</h1>
                <p>Plataforma de Gestión de Vulnerabilidades</p>
            </header>

            <form th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="usuario@gmail.com" required>

                <label for="contraseña">Contraseña</label>
                <input type="password" id="contraseña" name="password" placeholder="••••••••" required>

                <p th:if="${param.error}" style="color:red;">Credenciales no válidas.</p>
                <p th:if="${param.expired}" style="color:red;">La sesión terminó. Inicia sesión de nuevo.</p>

                <button type="submit">Iniciar Sesión</button>

            </form>

            <a th:href="@{/}">¿Olvidaste tu contraseña?</a>

        </section>
    </main>

    <footer class="pie-pagina-login">
        <p>Secure Access &bull; Encrypted Connection</p>
    </footer>
</body>
</html>
