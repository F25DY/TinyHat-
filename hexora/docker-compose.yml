services:
  hexora-bd:
    image: mysql:8.0
    container_name: hexora-mysql
    restart: unless-stopped
    # Los disparadores de informes (V33) exigen esto cuando el registro binario esta activo y la cuenta de migracion no es SUPER.
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      # The image grants this account ALL PRIVILEGES on the database: it is the MIGRATION account (Flyway).
      # Falls back to DB_USER only for old .env files that predate the account split.
      MYSQL_USER: ${FLYWAY_DB_USER:-${DB_USER}}
      MYSQL_PASSWORD: ${FLYWAY_DB_PASSWORD:-${DB_PASSWORD}}
      # Created by database/init/01-runtime-user.sh on first start of an empty volume: the runtime account.
      TINYHAT_RUNTIME_USER: ${DB_USER}
      TINYHAT_RUNTIME_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - hexora-mysql-data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Tarea de una sola ejecucion (se repite sin dano en cada "docker compose up"): asegura en volumenes YA existentes lo
  # que database/init/01-runtime-user.sh solo aplica al crear un volumen vacio. La cuenta de migracion (Flyway) necesita
  # GRANT OPTION sobre la base (RuntimePrivilegeMigrationStrategy) y el privilegio TRIGGER (V33, disparadores de informes).
  # Idempotente: volver a conceder lo mismo no cambia nada.
  hexora-bd-privilegios:
    image: mysql:8.0
    restart: "no"
    depends_on:
      hexora-bd:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${DB_ROOT_PASSWORD}
      TINYHAT_DB_NAME: ${DB_NAME}
      TINYHAT_MIGRATION_USER: ${FLYWAY_DB_USER:-${DB_USER}}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        ESC=$$(printf '%s' "$$TINYHAT_DB_NAME" | sed 's/_/\\_/g');
        mysql -h hexora-bd -uroot -e "GRANT ALL PRIVILEGES ON \`$$ESC\`.* TO '$$TINYHAT_MIGRATION_USER'@'%' WITH GRANT OPTION; SET GLOBAL log_bin_trust_function_creators = 1; FLUSH PRIVILEGES;"

volumes:
  hexora-mysql-data:
